<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript</title>

  <script>

    // document.getElementById('box01').style.color = 'red';

    // window.onload = function(){
    //   document.getElementById('box01').style.color = 'blue';
    // } onload: 윈도우에 모든 dom들이 로딩되었을 때 실행하라는 명령어

    // $(function(){
    //   $(document).ready(function(){

    //   });
    // });

    //addEventListener : 가장 트렌디한 function 불러들이는 코드
    document.addEventListener('DOMContentLoaded', function(){

      document.getElementById('box01').style.color = 'green';
      document.getElementById('box01').style.color = 'green';
      document.getElementById('box01').style.fontWeight = 'bold';

      document.getElementsByClassName('box02')[0].style.color = 'red'; //class는 중복해서 사용할 수 있기 때문에 정확하게 명령해줘야한다. [0] 0번째 class라는 뜻.(요즘 잘 안쓰는 코드)

      document.getElementsByTagName('li')[1].style.color = 'blue'; //Elements는 복수니까 정확하게 번호를 [1] 등으로 명령해줘야한다. (요즘 잘 안쓰는 코드)

      //가장 트렌디한 dom처리 코드
      document.querySelector('#box01').style.backgroundColor = '#eee';
      document.querySelector('.box02').style.backgroundColor = '#ccc';
      document.querySelectorAll('.box03 li')[2].style.backgroundColor = 'yellow';//복수는 배열로 처리해준다.


      const li = document.querySelectorAll('.box03 li');

      for(let i=0; i<li.length; i++){
        li[0].style.fontSize = '30px';
      } //순수 for문 (forEach문을 더 많이 쓰긴 함)

      li.forEach(function(value){
        value.style.color = 'purple';
      }); //li의 개수(value)만큼 돌겠다라는 뜻. (기본문)

      li.forEach((value) => {
        value.style.backgroundColor = 'pink';
      }); //arrow는 오류를 일으킬때도 있음. (그래서 function(value)를 기본으로 사용하는 게 좋음)


    }); //DOMContentLoaded_event 제일 많이 쓰는 이벤트처리 명령어


  </script>

</head>
<body>
  
  <div id="box01">Text_box01</div>

  <div class="box02">Text_box02</div>

  <ul class="box03">
    <li>Text_box03-1</li>
    <li>Text_box03-2</li>
    <li>Text_box03-3</li>
  </ul>


  <!-- <script>

    document.getElementById('box01').style.color = 'red';
    dom 뒤에 와야 순차적으로 잘 실행이 된다

  </script> -->

</body>
</html>
