    const fruits = ['apple', 'kiwi', 'banana', 'melon'];

    for(let i in fruits){
      document.write(`${fruits[i]} &nbsp;&nbsp;`)
    }
    document.write(`<br><br>`);

    fruits[0] = 'orange';
    fruits.unshift('orange2');
    fruits.push('mango');

    fruits.shift(); //데이터 맨 앞을 삭제
    fruits.pop(); //데이터 맨 뒤를 삭제

    //fruits.splice(2,1); //splice(index번호, 삭제개수)를 삭제
    let index = fruits.indexOf('banana'); //index번호 모를때 *************indexOF: 굉장히 중요.************
    fruits.splice(index, 1);

    fruits.splice(index, 0, 'cherry'); //이건 바나나를 체리로 변경해주는 것.

    for(let fruit of fruits){
      document.write(fruit, '&nbsp;&nbsp;');
    }












  </script>
